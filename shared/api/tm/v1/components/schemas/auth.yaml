RegisterRequest:
  type: object
  required:
    - email
    - password
    - name
  properties:
    email:
      type: string
      format: email
      example: user@example.com
    password:
      type: string
      format: password
      minLength: 6
      example: "securepass123"
    name:
      type: string
      minLength: 2
      example: "Иван Иванов"

LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      example: user@example.com
    password:
      type: string
      format: password
      example: "securepass123"

LoginResponse:
  type: object
  required:
    - token
  properties:
    token:
      type: string
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

UserResponse:
  type: object
  required:
    - id
    - email
    - name
    - created_at
  properties:
    id:
      type: integer
      example: 1
    email:
      type: string
      format: email
      example: user@example.com
    name:
      type: string
      example: "Иван Иванов"
    created_at:
      type: string
      format: date-time
      example: "2026-10-30T12:00:00Z"
